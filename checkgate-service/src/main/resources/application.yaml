server:
  port: 8080

spring:
  application:
    name: checkgate-service
  config:
    import: optional:classpath:application-local.yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/checkgate
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  task:
    scheduling:
      pool:
        size: 2   # lets the NVD and MITRE jobs overlap

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  retrieval-thinking-level: ${GEMINI_RETRIEVAL_THINKING:MEDIUM}
  analysis-thinking-level: ${GEMINI_ANALYSIS_THINKING:LOW}

github:
  token: ${GITHUB_TOKEN}

checkgate:
  ingestion:
    nvd-api-key: ${NVD_API_KEY}
    nvd-page-size: 200
    nvd-keywords: java,spring,tomcat,struts,log4j
  scan:
    max-diff-lines: 1000   # guard rail
    max-files: 50
  rag:
    min-similarity: 0.80
    top-n: 5